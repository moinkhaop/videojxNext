<!doctype html>
<html lang="zh-CN" class="popup">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VideoJX 助手</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="popup">
    <div class="container popup-shell">
      <div class="popup-top">
        <div class="popup-brand">
          <div class="popup-mark">VJ</div>
          <div class="col" style="gap: 2px;">
            <div class="popup-title">VideoJX</div>
            <div id="auth-status" class="muted">登录状态检查中...</div>
          </div>
        </div>
        <button id="open-options" class="ghost icon-btn" title="设置">设置</button>
      </div>

      <div class="card col">
        <h3>快速操作</h3>

        <div class="grid-actions">
          <button id="btn-get-share" class="primary">获取链接并复制</button>
          <button id="btn-fill-active" class="ghost">读取地址栏</button>
          <button id="btn-paste-clipboard" class="ghost">粘贴剪贴板</button>
          <button id="btn-check-session" class="ghost">刷新登录态</button>
        </div>

        <div class="muted">推荐页优先用“获取链接并复制”，不依赖抖音弹窗复制。</div>

        <div class="col">
          <label class="small">视频链接</label>
          <textarea id="video-url" wrap="soft" spellcheck="false" placeholder="可粘贴分享文案/链接，或直接用上方按钮自动获取。"></textarea>
        </div>

        <div id="share-meta" class="share-meta hidden">
          <div class="meta-item">
            <div class="meta-item-head">
              <div class="meta-label">短链</div>
              <div class="meta-actions">
                <button id="btn-copy-short" class="chip">复制</button>
                <button id="btn-use-short" class="chip">使用</button>
              </div>
            </div>
            <code id="meta-short" class="meta-value"></code>
          </div>

          <div class="meta-item">
            <div class="meta-item-head">
              <div class="meta-label">长链</div>
              <div class="meta-actions">
                <button id="btn-copy-long" class="chip">复制</button>
                <button id="btn-use-long" class="chip">使用</button>
              </div>
            </div>
            <code id="meta-long" class="meta-value"></code>
          </div>

          <div class="meta-foot muted">
            <span>awemeId: </span><code id="meta-aweme"></code>
            <span style="margin-left: 10px;">来源: </span><code id="meta-source"></code>
          </div>
        </div>

        <div class="row" style="align-items: flex-end;">
          <div class="col" style="flex: 1;">
            <label class="small">解析器</label>
            <select id="parser-select"></select>
          </div>
          <div class="col" style="flex: 1;">
            <label class="small">WebDAV</label>
            <select id="webdav-select"></select>
          </div>
        </div>

        <div class="row wrap" style="justify-content: space-between;">
          <button id="btn-parse" class="secondary" style="flex: 1;">解析预览</button>
          <button id="btn-upload" class="primary" style="flex: 1;">直接上传</button>
        </div>
      </div>

      <div class="card col">
        <h3>结果</h3>
        <div id="result-box" class="notice">尚未执行任务</div>
      </div>
    </div>

    <script src="shared.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
